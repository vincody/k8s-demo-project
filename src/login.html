<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>K8S Observer | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">
    <div class="bg-gray-800 p-8 rounded-lg shadow-2xl w-96 border-t-4 border-cyan-500">
        <h2 class="text-2xl font-bold mb-6 text-cyan-400 uppercase tracking-widest text-center">Identity Check</h2>
        <div class="space-y-4">
            <input type="password" id="pass" onkeyup="if(event.key==='Enter') doLogin()" placeholder="Mật khẩu từ Ubuntu..." class="w-full bg-gray-900 border border-gray-700 p-3 rounded focus:outline-none focus:border-cyan-500">
            
            <button onclick="doLogin()" class="w-full bg-cyan-600 hover:bg-cyan-500 p-3 rounded font-bold transition uppercase shadow-lg active:transform active:scale-95">Đăng nhập</button>
            
            <p id="msg" class="text-red-500 text-sm font-medium text-center mt-2 min-h-[1.25rem]"></p>
        </div>
    </div>

    <script>
        async function doLogin() {
            const password = document.getElementById('pass').value;
            const msgElement = document.getElementById('msg');
            
            // Xóa thông báo cũ mỗi khi bấm nút
            msgElement.innerText = "";

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ password })
                });
                
                const data = await res.json();
                
                if (res.ok && data.success) {
                    // Đăng nhập thành công
                    localStorage.setItem('k8s_auth_token', 'active');
                    window.location.href = '/';
                } else {
                    // Hiển thị đúng câu thông báo từ Backend (ví dụ: "Còn 3 lần thử" hoặc "Thử lại sau 15 phút")
                    msgElement.innerText = data.message || "Lỗi đăng nhập!";
                }
            } catch (error) {
                msgElement.innerText = "Lỗi kết nối: Server không phản hồi!";
            }
        }
    </script>
</body>
</html>
